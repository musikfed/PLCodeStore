[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plcodestore"
version = "0.1.0"
description = "Local-first reviewed software portfolio builder"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.110,<1", "uvicorn>=0.27,<1", "jinja2>=3.1,<4", "httpx>=0.27,<1", "jsonschema>=4.20,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
screenshots = ["playwright>=1.45,<2"]

[project.scripts]
plcodestore = "plcodestore.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
